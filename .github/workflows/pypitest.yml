# This workflow will install Python dependencies using Mamba, run tests and lint with a single version of Python

name: pypi-test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" #run every Tuesday night at 2AM UTC

permissions:
  contents: read

jobs:
  mamba-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        #python-version: ["3.10"]
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - uses: actions/checkout@v7
    - uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: ecmean
        cache-downloads: true
        cache-environment: true
        create-args: >-
          python=${{ matrix.python-version }}
          xesmf>=0.8
          esmpy
          eccodes
          pytest
    - name: Install ecmean
      run: |
        # install package
        python -m pip install ecmean
    - name: Test with pytest
      run: |
        python -m pytest
