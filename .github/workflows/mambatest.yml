# This workflow will install Python dependencies using Mamba,
# run tests and lint with a single version of Python

name: mamba-test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" #run every Monday night at 2AM UTC

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install ruff
      run: pip install ruff
    - name: Lint and format check with ruff
      run: ruff check .
    - name: Check code formatting with ruff
      run: ruff format --check .

  mamba-test:
    runs-on: ubuntu-latest
    needs: ruff-check
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        #python-version: ["3.14"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v7
    - name: provision-with-micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        environment-name: ecmean
        cache-downloads: true
        cache-environment: false
        post-cleanup: environment
        condarc: |
          channels:
            - conda-forge
        create-args: >-
            python=${{ matrix.python-version }}
    - name: Upgrade pip and build tools
      run: python -m pip install --upgrade pip setuptools wheel
    - name: Install package and test dependencies from pyproject.toml
      run: python -m pip install -e ".[tests]"
    - name: Run tests with pytest
      run: pytest

  coverage:
    runs-on: ubuntu-latest
    needs: ruff-check
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v7
    - name: provision-with-micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        environment-name: ecmean
        cache-downloads: true
        cache-environment: false
        post-cleanup: environment
        condarc: |
          channels:
            - conda-forge
        create-args: >-
            python=3.14
    - name: Upgrade pip and build tools
      run: python -m pip install --upgrade pip setuptools wheel
    - name: Install coverage tools
      run: |
        python -m pip install coverage
        python -m pip install coveralls
    - name: Install package and test dependencies
      run: python -m pip install -e ".[tests]"
    - name: Install pytest
      run: python -m pip install pytest
    - name: Run coverage
      run: |
        coverage run -m pytest
        coverage combine
        coverage lcov
    - name: Run coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: coverage.lcov
