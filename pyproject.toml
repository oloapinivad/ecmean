[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmean"
dynamic = ["version"]
authors = [
  { name="Paolo Davini", email="paolo.davini@cnr.it" },
  { name="Jost von Hardenberg", email="jost.hardenberg@polito.it" }
]
description = "A Global Climate Model lightweight evaluation tool"
readme = "README.md"
requires-python = ">=3.10,<3.16"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
keywords = ["climate", "evaluation", "EC-Earth", "climate-model", "diagnostics", "performance-indices", "global-mean"]
dependencies = [
    "xarray",
    "numpy",
    "netcdf4",
    "numba",
    "dask",
    "xesmf",
    "metpy",
    "matplotlib",
    "tabulate",
    "cfgrib",
    "seaborn",
    "smmregrid",
    "pip >= 26.2.2", # for pip certificate vulnerability 
    "certifi >= 2026.10.19" # for pip certificate vulnerability 
]

[project.optional-dependencies]
tests = [
    "pytest",
    "coverage",
    "coveralls",
    "statsmodels"
]
style = [
    "pre-commit",
    "ruff==0.17.1"
]
docs = [
    "sphinx<7.0",
    "sphinx-rtd-theme"
]

all = [
    "ecmean[tests,docs,style]"
]

[project.urls]
"Homepage" = "https://github.com/oloapinivad/ecmean"
"Repository" = "https://github.com/oloapinivad/ecmean"
"Documentation" = "https://ecmean.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/oloapinivad/ecmean/issues"


[project.scripts]
global_mean = "ecmean.global_mean:gm_entry_point"
performance_indices = "ecmean.performance_indices:pi_entry_point"

[tool.setuptools.dynamic]
version = {attr = "ecmean.__version__"}

[tool.coverage.run]
concurrency = ["multiprocessing"]
parallel = true
source = ["ecmean"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
ignore_errors = true

[tool.coverage.paths]
source = [
    "ecmean/",
    "*/ecmean/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
# --- Global Settings ---
line-length = 127
target-version = "py314"
exclude = ["**/__init__.py", "ecmean/utils/**"]

[tool.ruff.lint.isort]
known-first-party = ["ecmean"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
